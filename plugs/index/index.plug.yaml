name: index
# Adding a file to Zotero calls its Web API from the sandbox.
requiredPermissions:
  - fetch
functions:
  # Public API
  extractFrontmatter:
    path: api.ts:extractFrontmatter
    syscall:
      name: index.extractFrontmatter
      description: Extracts and optionally transforms frontmatter and top-level tags in Markdown text.
      parameters:
        - { name: text, type: string, description: Markdown text to inspect. }
        - { name: options, type: table, description: Optional frontmatter and tag removal settings., optional: true }
      returns:
        - { type: table, description: Parsed frontmatter and the optionally transformed text. }
      see: API/index
  patchFrontmatter:
    path: api.ts:patchFrontmatter
    syscall:
      name: index.patchFrontmatter
      description: Applies a table of updates to the frontmatter in Markdown text.
      parameters:
        - { name: text, type: string, description: Markdown text to update. }
        - { name: patch, type: table, description: Frontmatter keys and values to merge. }
      returns:
        - { type: string, description: Markdown text with updated frontmatter. }
      see: API/index
  text:
    path: indexer.ts:indexMarkdown
    syscall:
      name: index.markdown
      description: Indexes Markdown text in memory and returns the objects extracted from it.
      parameters:
        - { name: text, type: string, description: Markdown text to index. }
        - { name: pageMeta, type: table, description: Optional page metadata used during indexing., optional: true }
      returns:
        - { type: table, description: Objects extracted from the Markdown text. }
      see: API/index
  resolveAnchor:
    path: api.ts:resolveAnchor
    syscall:
      name: index.resolveAnchor
      description: Resolves a named anchor to its host page, tag, and source range.
      parameters:
        - { name: name, type: string, description: Anchor name without the leading dollar sign. }
        - { name: page, type: string, description: Optional page to restrict the lookup to., optional: true }
      returns:
        - { type: table, description: Resolution result including success or missing/duplicate reason. }
      see: API/index
  queryLuaObjects:
    # DEPRECATED: use index.queryLuaObjects syscall instead
    path: api.ts:queryLuaObjects
  getObjectByRef:
    # DEPRECATED: use index.getObjectByRef syscall instead
    path: api.ts:getObjectByRef

  # YAML syscalls
  yamlParse:
    path: yaml.ts:parse
    syscall:
      name: yaml.parse
      description: Parses a YAML string into a Lua value.
      parameters:
        - { name: text, type: string, description: YAML source text. }
      returns:
        - { description: Parsed YAML value. }
      see: API/yaml

  yamlStringify:
    path: yaml.ts:stringify
    syscall:
      name: yaml.stringify
      description: Serializes a Lua value as YAML text.
      parameters:
        - { name: value, description: Value to serialize. }
      returns:
        - { type: string, description: YAML representation of the value. }
      see: API/yaml

  reindexSpaceCommand:
    path: "./command.ts:reindexCommand"
    command:
      name: "Space: Reindex"
      menu: { location: space, group: "2_index", order: 1, label: "Reindex Space" }

  processIndexQueue:
    path: ./queue.ts:processIndexQueue
    mqSubscriptions:
      - queue: indexQueue
        batchSize: 8
        autoAck: false

  indexDocument:
    path: "./document.ts:indexDocument"
    events:
      - document:index
  # The Better BibTeX export is a document; when it changes, so does the
  # `zotero` index built from it.
  indexBibliography:
    path: "./zotero.ts:indexBibliography"
    events:
      - document:index

  indexPage:
    path: indexer.ts:indexPage
    events:
      - page:index

  # Denote
  newDenoteNote:
    path: ./denote.ts:newDenoteNoteCommand
    command:
      name: "Denote: New Note"
      requireMode: rw
  denoteInsertLinksDblock:
    path: ./denote.ts:insertLinksDblockCommand
    command:
      name: "Denote: Insert Links Block"
      requireMode: rw
      requireEditor: page
  denoteInsertBacklinksDblock:
    path: ./denote.ts:insertBacklinksDblockCommand
    command:
      name: "Denote: Insert Backlinks Block"
      requireMode: rw
      requireEditor: page
  denoteInsertMissingLinksDblock:
    path: ./denote.ts:insertMissingLinksDblockCommand
    command:
      name: "Denote: Insert Missing Links Block"
      requireMode: rw
      requireEditor: page
  denoteInsertTodaysLinksDblock:
    path: ./denote.ts:insertTodaysLinksDblockCommand
    command:
      name: "Denote: Insert Today's Links Block"
      requireMode: rw
      requireEditor: page
  denoteUpdateDynamicBlocks:
    path: ./denote.ts:updateDynamicBlocksCommand
    command:
      name: "Denote: Update Dynamic Blocks"
      requireMode: rw
      requireEditor: page
  denoteUpdateDblocksOnSave:
    path: ./denote.ts:updateDynamicBlocksOnSave
    events:
      - page:saved

  # Naming a pasted or uploaded document — see `denoteAttachmentPath`. Both
  # the upload command and the editor's paste handler call this, so an
  # identifier is issued from one place and stays unique library-wide.
  denoteAttachmentPath:
    path: ./denote.ts:denoteAttachmentPath

  denoteRenameFromFrontMatter:
    path: ./denote.ts:renameFromFrontMatterCommand
    command:
      name: "Denote: Rename File from Front Matter"
      requireMode: rw
      requireEditor: page
  denoteRenameOnSave:
    path: ./denote.ts:renameFromFrontMatterOnSave
    events:
      - page:saved

  newDenoteNoteWithSignature:
    path: ./denote.ts:newDenoteNoteWithSignatureCommand
    command:
      name: "Denote: New Note with Signature"
      requireMode: rw
  # `denote-link-or-create` (M-i) and `org-insert-link` (M-I) under one key:
  # on a link there is a link to edit, off one there is a link to make.
  denoteLinkOrCreate:
    path: ./denote.ts:denoteLinkOrCreateCommand
    command:
      name: "Denote: Insert or Edit Link"
      key: "Alt-i"
      mac: "Alt-i"
      requireMode: rw
      requireEditor: page
  # `denote-open-or-create`: what the page picker's create row calls.
  denoteOpenOrCreate:
    path: ./denote.ts:denoteOpenOrCreate
  # The `[[` completion's create row -- see `denoteCreateFromLink`.
  denoteCreateFromLink:
    path: ./denote.ts:denoteCreateFromLink
  # denote-journal. The `Journal:` commands in Library/Std delegate to these,
  # so there is one journal system rather than two.
  denoteJournalOpenOrCreate:
    path: ./denote.ts:denoteJournalOpenOrCreate
  denoteJournalEntries:
    path: ./denote.ts:denoteJournalEntries
  denoteJournalToday:
    path: ./denote.ts:denoteJournalTodayCommand
    command:
      name: "Denote: Journal Today"
      requireMode: rw
  denoteJournalPrevious:
    path: ./denote.ts:denoteJournalPreviousCommand
    command:
      name: "Denote: Journal Previous"
  denoteJournalNext:
    path: ./denote.ts:denoteJournalNextCommand
    command:
      name: "Denote: Journal Next"
  # Signatures as sequences (denote-sequence), and renaming in place
  # (denote-rename-file, denote-keywords-add/remove).
  denoteBrowseBySignature:
    path: ./denote_sequence.ts:browseBySignatureCommand
    command:
      name: "Denote: Browse by Signature"
  denoteSignatureParent:
    path: ./denote_sequence.ts:signatureParentCommand
    command:
      name: "Denote: Signature Parent"
  denoteSignatureChildren:
    path: ./denote_sequence.ts:signatureChildrenCommand
    command:
      name: "Denote: Signature Children"
  denoteSignatureSiblings:
    path: ./denote_sequence.ts:signatureSiblingsCommand
    command:
      name: "Denote: Signature Siblings"
  denoteSignatureNext:
    path: ./denote_sequence.ts:signatureNextCommand
    command:
      name: "Denote: Signature Next"
  denoteSignaturePrevious:
    path: ./denote_sequence.ts:signaturePreviousCommand
    command:
      name: "Denote: Signature Previous"
  denoteNewChildNote:
    path: ./denote_sequence.ts:newChildNoteCommand
    command:
      name: "Denote: New Child Note"
  denoteNewSiblingNote:
    path: ./denote_sequence.ts:newSiblingNoteCommand
    command:
      name: "Denote: New Sibling Note"
  denoteRenameNote:
    path: ./denote_sequence.ts:renameNoteCommand
    command:
      name: "Denote: Rename"
  denoteSetSignature:
    path: ./denote_sequence.ts:setSignatureCommand
    command:
      name: "Denote: Set Signature"
  denoteAddKeywords:
    path: ./denote_sequence.ts:addKeywordsCommand
    command:
      name: "Denote: Add Keywords"
  denoteRemoveKeywords:
    path: ./denote_sequence.ts:removeKeywordsCommand
    command:
      name: "Denote: Remove Keywords"
  # Generated pages under `denote/` (signatures, keywords, calendar, health)
  # and the pickers of denote-find-link / denote-find-backlink.
  denoteGenerateView:
    path: ./denote_views.ts:generateView
    events:
      - editor:pageCreating
  denoteSignaturesPage:
    path: ./denote_views.ts:browseSignaturesPageCommand
    command:
      name: "Denote: Signatures Page"
  denoteKeywordsPage:
    path: ./denote_views.ts:browseKeywordsPageCommand
    command:
      name: "Denote: Keywords Page"
  denoteJournalCalendar:
    path: ./denote_views.ts:journalCalendarCommand
    command:
      name: "Denote: Journal Calendar"
  denoteJournalOpenDate:
    path: ./denote_views.ts:journalOpenDateCommand
    command:
      name: "Denote: Journal Open Date"
  denoteLibraryHealth:
    path: ./denote_views.ts:libraryHealthCommand
    command:
      name: "Denote: Library Health"
  denoteFindLink:
    path: ./denote_views.ts:findLinkCommand
    command:
      name: "Denote: Find Link"
  denoteFindBacklink:
    path: ./denote_views.ts:findBacklinkCommand
    command:
      name: "Denote: Find Backlink"
  denoteRandomNote:
    path: ./denote_views.ts:randomNoteCommand
    command:
      name: "Denote: Random Note"

  # Zotero -- see zotero.ts.
  zoteroInsertCitation:
    path: ./zotero.ts:insertCitationCommand
    command:
      name: "Zotero: Insert Citation"
      requireMode: rw
      requireEditor: page
  zoteroNewReferenceNote:
    path: ./zotero.ts:newReferenceNoteCommand
    command:
      name: "Zotero: New Reference Note"
      requireMode: rw
  zoteroOpen:
    path: ./zotero.ts:openUnderCursorCommand
    command:
      name: "Zotero: Open"
      requireEditor: page
  zoteroToggleDesktop:
    path: ./zotero.ts:toggleDesktopCommand
    command:
      name: "Zotero: Toggle Open in Desktop App"
  zoteroAddFile:
    path: ./zotero.ts:addFileCommand
    command:
      name: "Zotero: Add File"
      requireMode: rw
      requireEditor: page
  # Called by the paste and upload paths: a file into Zotero, a link back.
  zoteroAdd:
    path: ./zotero.ts:addFile
  zoteroCanAddFiles:
    path: ./zotero.ts:canAddFiles
  zoteroLinkForItem:
    path: ./zotero.ts:linkForItem
  # Called by the editor plug when a citation or zotero: link is followed.
  zoteroOpenCitekey:
    path: ./zotero.ts:openCitekey
  zoteroOpenItemKey:
    path: ./zotero.ts:openItemKey

  # Headers
  headerComplete:
    path: header.ts:headerComplete
    events:
      - editor:complete

  # Anchors
  anchorComplete:
    path: complete.ts:anchorComplete
    events:
      - editor:complete

  # Hashtags
  tagComplete:
    path: tags.ts:tagComplete
    events:
      - editor:complete

  atMentionComplete:
    path: identity.ts:atMentionComplete
    events:
      - editor:complete

  resolveAtMention:
    path: identity.ts:resolveAtMention

  listIdentities:
    path: identity.ts:listIdentities

  frontmatterValueComplete:
    path: frontmatter_value_complete.ts:frontmatterValueComplete
    events:
      - editor:complete

  frontmatterComplete:
    path: frontmatter.ts:frontmatterComplete
    events:
      - editor:complete

  renamePageCommand:
    path: "./refactor.ts:renamePageCommand"
    command:
      name: "Page: Rename"
      menu: { location: file, group: "4_page", order: 1, label: "Rename Page..." }
      page: ""
      requireMode: rw
      requireEditor: page
  renamePrefixCommand:
    path: "./refactor.ts:renamePrefixCommand"
    command:
      name: "Page: Batch Rename Prefix"
      requireMode: rw
      requireEditor: page
  renamePageLinkCommand:
    path: "./refactor.ts:renamePageLinkCommand"
    command:
      name: "Page: Rename Linked Page"
      requireMode: rw
      requireEditor: page

  # Refactoring Commands

  renameDocumentCommand:
    path: "./refactor.ts:renameDocumentCommand"
    command:
      name: "Document: Rename Document"
      requireMode: rw
      requireEditor: notpage

  extractToPageCommand:
    path: ./refactor.ts:extractToPageCommand
    command:
      name: "Page: Extract"
      requireMode: rw
      requireEditor: page

  refreshWidgets:
    path: widget.ts:refreshWidgets

  lintYAML:
    path: lint.ts:lintYAML
    events:
      - editor:lint

  lintLua:
    path: lint.ts:lintLua
    events:
      - editor:lint

  lintObjects:
    path: lint.ts:lintObjects
    events:
      - editor:lint

  lintAnchors:
    path: lint.ts:lintAnchors
    events:
      - editor:lint

  requalifyAfterSave:
    path: requalify.ts:requalifyAfterSave
    events:
      - page:saved

  invalidateOnFileAppeared:
    path: invalidate.ts:invalidateOnFileAppeared
    events:
      - file:changed

  invalidateOnFileDeleted:
    path: invalidate.ts:invalidateOnFileDeleted
    events:
      - file:deleted

  # X-Ray editor lens
  xrayInfo:
    path: xray.ts:xrayInfo
    events:
      - editor:lint

  toggleXRayMode:
    path: xray.ts:toggleXRayMode
    command:
      name: "Editor: Toggle X-Ray"
      requireEditor: page

  # Tasks
  updateTaskState:
    path: task.ts:updateTaskState

  taskToggle:
    path: "./task.ts:taskToggle"
    events:
      - page:click
  cycleTaskStateByRef:
    path: ./task.ts:cycleTaskStateByRef
  taskToggleCommand:
    path: ./task.ts:taskCycleCommand
    command:
      name: "Task: Cycle State"
      key: Mod-. t
      requireMode: rw
      requireEditor: page

  taskComplete:
    path: ./complete.ts:completeTaskState
    events:
      - editor:complete

  removeCompletedTasksCommand:
    path: task.ts:removeCompletedTasksCommand
    command:
      name: "Task: Remove Completed"
      requireMode: rw
      requireEditor: page
